<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reading the Regulator — carousel v2</title>
<style>
@font-face { font-family: "JB"; font-weight: 400; src: url(fonts/jb400.ttf); }
@font-face { font-family: "JB"; font-weight: 500; src: url(fonts/jb500.ttf); }
@font-face { font-family: "IN"; font-weight: 300; src: url(fonts/roboto300.ttf); }
@font-face { font-family: "IN"; font-weight: 400; src: url(fonts/roboto400.ttf); }
@font-face { font-family: "IN"; font-weight: 500; src: url(fonts/roboto500.ttf); }
@font-face { font-family: "IN"; font-weight: 800; src: url(fonts/roboto700.ttf); }
@font-face { font-family: "IN"; font-weight: 900; src: url(fonts/roboto900.ttf); }
@page { size: 1080px 1350px; margin: 0; }
html, body { margin: 0; background: #0B1724; }
.slide { width: 1080px; height: 1350px; overflow: hidden; page-break-after: always; break-after: page; }
svg { display: block; }
text { font-family: "IN", sans-serif; }
text.mono { font-family: "JB", monospace; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ==========================================================================
   READING THE REGULATOR — carousel v2 content. Change ONLY this block each week.
   Slide types:  cover | point | reading (the ONLY full-compass slide)
   Every slide keeps the gold needle mark and the radar rings from it.
   "|" forces a line break. Text in [brackets] renders as a visible placeholder.
   ========================================================================== */
const CONTENT = {
  HANDLE: "READING THE REGULATOR — 01",          // top-left
  AUTHOR_PILL: "ANWAR SAWYER",                    // top-right pill
  URL_PILL: "sawyer-co.com",                      // bottom-left pill
  SOURCE: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025 (28 AUG 2026)",

  SLIDES: [
    { type: "cover", numeral: "2.5×", headline: "SUPERVISORY|SCRUTINY", sub: "SCB examinations, 2021–2025", portrait: true },
    { type: "point", numeral: "1", headline: "EXAMS|31 → 76", sub: "Concluded, 2021 vs 2025.|Up 145% in four years.",
      source: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025, TABLE 4.1" },
    { type: "point", numeral: "2", headline: "FINDINGS PER|EXAM FELL", sub: "AML/CFT/CPF per exam:|7.7 in 2022, 3.3 in 2025.",
      source: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025, FIG. 5.2" },
    { type: "point", numeral: "3", headline: "AML FINDINGS|DIDN'T FALL", sub: "248 in 2022.|248 in 2025.",
      source: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025, TABLE 5.1" },
    { type: "point", numeral: "4", headline: "MOSTLY|THEMATIC IN 2025", sub: "64 of 76 exams. Routine|years 2022–24: 7.7 → 4.4.",
      source: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025, TABLES 4.1, 5.2" },
    { type: "point", numeral: "5", headline: "SANCTIONS|TOP THE LIST", sub: "Sanctions screening|and filings: 105 in 2025.",
      source: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025, TABLE 5.2" },
    { type: "closing", headline: "HAS YOUR EXAM|CYCLE CHANGED?", sub: "Exams up 2.5× since 2021. What have you seen?" },
  ],
};

const L = {
  W: 1080, H: 1350, pad: 96, M: 96, R: 984,
  needle: { x: 950, y: 262, scale: 0.9 },
  pill: { x: 745, y: 95, w: 271, h: 56 },
  url: { x: 96, y: 1134, h: 52 },
  numeral: { x: 130, base: 650, size: 363 },
  head: { lastBase: 630, startSize: 100, pitch: 0.96, right: 1016 },
  sub: { gap: 100, size: 64, pitch: 1.12, indent: 18 },
};
/* ========================================================================== */

const NS = "http://www.w3.org/2000/svg";
let cur = null, curSource = '', curNarrow = false, curHero = false;
const SAND = "#E9DFC6", GOLD = (a) => `rgba(200,169,110,${a})`, NB = " ";
const el = (name, attrs = {}, parent = cur) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const txt = (str, attrs, parent, mono) => { const t = el("text", attrs, parent); if (mono) t.setAttribute("class", "mono"); t.textContent = str.replace(/ /g, NB); return t; };
const toRad = (deg) => (deg - 90) * Math.PI / 180;
const P = (r, deg) => [r * Math.cos(toRad(deg)), r * Math.sin(toRad(deg))];
const isPH = (s) => /^\[.*\]$/.test(s.trim());

/* ---- background: navy, glow blobs, diagonal grid, radar rings from the needle ---- */
function background(nx, ny) {
  const defs = el("defs");
  const blob = (id, cx, cy, r, c, a) => { const g = el("radialGradient", { id, gradientUnits: "userSpaceOnUse", cx, cy, r }, defs); el("stop", { offset: 0, "stop-color": c, "stop-opacity": a }, g); el("stop", { offset: 1, "stop-color": c, "stop-opacity": 0 }, g); };
  blob("b1", 120, 90, 560, "#4f7aa3", 0.55);
  blob("b2", 1040, 240, 760, "#3b6a93", 0.50);
  blob("b3", 1020, 1330, 560, "#C8A96E", 0.34);
  blob("b4", 540, 760, 640, "#1c3550", 0.60);
  el("rect", { width: L.W, height: L.H, fill: "#0B1724" });
  ["b4", "b1", "b2", "b3"].forEach((id) => el("rect", { width: L.W, height: L.H, fill: `url(#${id})` }));
  [[240, .08], [380, .065], [520, .052], [660, .042], [800, .034], [940, .026]].forEach(([r, o]) =>
    el("circle", { cx: nx, cy: ny, r, fill: "none", stroke: `rgba(210,190,150,${o})`, "stroke-width": 1.4 }));
}

function needle(cx, cy, s, rot = 0) {
  const DH = 40, DW = 24;
  const g = el("g", { transform: `translate(${cx} ${cy}) scale(${s}) rotate(${rot})` });
  el("circle", { cx: 0, cy: 0, r: 34, fill: "rgba(200,169,110,.10)" }, g);
  const poly = (pts, fill) => el("polygon", { points: pts.map((p) => p.join(",")).join(" "), fill }, g);
  poly([[0, -DH], [-DW, 0], [0, DH]], "rgba(120,90,35,.7)");
  poly([[0, -DH], [DW, 0], [0, DH]], "rgba(215,178,100,.85)");
  poly([[0, -DH], [-DW, 0], [-DW * .35, -DH * .3]], "rgba(175,140,72,.6)");
  poly([[0, -DH], [DW, 0], [DW * .35, -DH * .3]], "rgba(245,215,148,.75)");
  poly([[0, DH], [-DW, 0], [-DW * .3, DH * .35]], "rgba(100,78,30,.55)");
  poly([[0, DH], [DW, 0], [DW * .3, DH * .35]], "rgba(165,132,65,.6)");
  poly([[0, -DH], [DW * .55, -DH * .3], [DW * .18, -DH * .52]], "rgba(255,252,235,.8)");
  el("polygon", { points: `0,${-DH} ${DW},0 0,${DH} ${-DW},0`, fill: "none", stroke: "rgba(218,185,115,.9)", "stroke-width": .9 }, g);
  el("circle", { cx: 0, cy: 0, r: 2.2, fill: "rgba(255,250,225,.95)" }, g);
}

/* ---- chrome: handle, author pill, URL pill, arrow, source ---- */
function chrome(C, opts = {}) {
  if (curNarrow && !curHero) needle(58, 123, 0.5);          // portrait slides: the series needle sits beside the handle
  txt(C.HANDLE, { x: L.M, y: 132, fill: "#F5F0E8", "font-size": 26, "font-weight": 300, "letter-spacing": 1.5 });
  const p = L.pill, pt = txt(C.AUTHOR_PILL, { x: 0, y: p.y + 38, fill: "#F5F0E8", "font-size": 26, "font-weight": 500, "letter-spacing": 2 });
  const pw = Math.max(p.w, pt.getComputedTextLength() + 60), px0 = L.R - pw;
  pt.setAttribute("x", px0 + 30);
  const pr = el("rect", { x: px0, y: p.y, width: pw, height: p.h, rx: 14, fill: "rgba(200,169,110,.10)", stroke: GOLD(.85), "stroke-width": 3 });
  cur.insertBefore(pr, pt);
  if (opts.url !== false) {
    const t = txt(C.URL_PILL, { x: L.url.x + 28, y: L.url.y + 36, fill: "#0D1B2A", "font-size": 30, "font-weight": 500 });
    const w = t.getComputedTextLength() + 56;
    el("rect", { x: L.url.x, y: L.url.y, width: w, height: L.url.h, rx: 10, fill: "#F0E5CB", stroke: GOLD(1), "stroke-width": 3 }, cur);
    cur.appendChild(t);
  }
  if (opts.arrow !== false) {
    const ax = L.R;                          // arrow ends on the right margin
    el("line", { x1: ax - 158, y1: 1160, x2: ax, y2: 1160, stroke: "#F5F0E8", "stroke-width": 3, "stroke-linecap": "round" });
    el("polyline", { points: `${ax - 26},1142 ${ax},1160 ${ax - 26},1178`, fill: "none", stroke: "#F5F0E8", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" });
  }
  if (curNarrow) {            // two short lines in the clear left column (keeps the source off the photo / rooster)
    const words = curSource.split(" "), lines = []; let line = "";
    words.forEach((w) => { const t = line ? line + " " + w : w; if (t.length > 32) { lines.push(line); line = w; } else line = t; });
    lines.push(line);
    lines.forEach((ln, i) => txt(ln, { x: L.url.x, y: 1230 + i * 24, fill: GOLD(.85), "font-size": 16, "letter-spacing": 2 }, cur, true));
  } else txt(curSource, { x: L.url.x, y: 1236, fill: GOLD(.8), "font-size": 17, "letter-spacing": 2.2 }, cur, true);
}

/* ---- text layout: "|" forced breaks, wrap, auto-fit ---- */
function layoutText(str, maxW, startSize, maxLines, weight, minSize = 28) {
  const probe = el("text", { x: -9999, y: -9999, "font-weight": weight, "letter-spacing": 1 });
  const widthOf = (s, size) => { probe.setAttribute("font-size", size); probe.textContent = s.replace(/ /g, NB); return probe.getComputedTextLength(); };
  for (let size = startSize; size >= minSize; size -= 2) {
    const lines = [];
    str.split("|").forEach((seg) => {
      let line = "";
      seg.split(" ").forEach((w) => { const t = line ? line + " " + w : w; if (line && widthOf(t, size) > maxW) { lines.push(line); line = w; } else line = t; });
      lines.push(line);
    });
    if (lines.length <= maxLines && lines.every((l) => widthOf(l, size) <= maxW)) { probe.remove(); return { lines, size }; }
  }
  probe.remove(); return { lines: str.split("|"), size: minSize };
}
const inkBox = (str, size, weight, ls = 0) => {      // visible extent of the glyphs relative to the text origin
  const c = document.createElement("canvas").getContext("2d");
  c.font = `${weight} ${size}px IN`; c.letterSpacing = ls + "px";
  const m = c.measureText(str.replace(/ /g, NB));
  return { left: m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight };
};
const measure = (str, size, weight) => { const t = el("text", { x: -9999, y: -9999, "font-size": size, "font-weight": weight, "letter-spacing": 1 }); t.textContent = str.replace(/ /g, NB); const w = t.getComputedTextLength(); t.remove(); return w; };

function headBlock(S, x, maxW, lastBase, startSize, maxLines, anchor = "start") {
  const { lines, size } = layoutText(S.headline, maxW, startSize, maxLines, 800);
  const pitch = size * L.head.pitch, y0 = lastBase - (lines.length - 1) * pitch;
  lines.forEach((ln, i) => txt(ln, { x, y: y0 + i * pitch, "text-anchor": anchor, fill: "#FFFFFF", "font-weight": 800, "font-size": size, "letter-spacing": 1 }));
  return { size, pitch, top: y0 - size * 0.74 };
}
function subBlock(str, x, y, maxW, size, maxLines = 3, anchor = "start") {
  const ph = isPH(str);
  const { lines, size: z } = layoutText(str, maxW, size, maxLines, 300, 30);
  lines.forEach((ln, i) => {
    const t = txt(ln, { x, y: y + i * z * L.sub.pitch, "text-anchor": anchor, fill: ph ? "rgba(233,223,198,.6)" : SAND, "font-weight": 300, "font-size": z, "letter-spacing": 0 });
    if (ph) { const w = t.getComputedTextLength(); el("rect", { x: x - 14, y: y + i * z * L.sub.pitch - z + 6, width: w + 28, height: z + 22, rx: 6, fill: "none", stroke: GOLD(.7), "stroke-width": 2, "stroke-dasharray": "9 8" }); }
  });
}

/* ---- the full compass (reading slide only) ---- */
function fullCompass(S, cx0, cy0, scale) {
  const ox = cx0, oy = cy0, Sc = scale, R1 = 76, R2 = 65, R3 = 56, ARM = 90;
  const g = el("g", { transform: `translate(${ox} ${oy}) scale(${Sc})` });
  const pb = Math.min(215, Math.max(160, S.PLOT_BEARING)); const [px, py] = P(S.PLOT_DISTANCE, pb);
  el("line", { x1: px, y1: py, x2: 0, y2: 0, stroke: GOLD(.65), "stroke-width": .9, "stroke-linecap": "round" }, g);
  [10, 17].forEach((r, i) => el("circle", { cx: px, cy: py, r, fill: "none", stroke: GOLD(i ? .2 : .45), "stroke-width": .7 }, g));
  el("circle", { cx: px, cy: py, r: 3.2, fill: "#c8a96e" }, g);
  [[R1, .45, .8], [R2, .28, .6], [R3, .2, .5]].forEach(([r, o, w]) => el("circle", { cx: 0, cy: 0, r, fill: "none", stroke: GOLD(o), "stroke-width": w }, g));
  for (let d = 0; d < 360; d += 10) {
    const major = d % 30 === 0, card = d % 90 === 0;
    const [x1, y1] = P(card ? R2 - 4 : major ? R1 - 10 : R1 - 5, d), [x2, y2] = P(R1, d);
    el("line", { x1, y1, x2, y2, stroke: GOLD(card ? .9 : major ? .65 : .38), "stroke-width": card ? 1.2 : major ? .8 : .5 }, g);
  }
  [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([l, d]) => { const [x, y] = P(R2 - 14, d); txt(l, { x, y: y + 4, "text-anchor": "middle", fill: GOLD(.85), "font-size": 13, "font-weight": 500 }, g, true); });
  [0, 90, 180, 270].forEach((d) => { const [x1, y1] = P(R3, d), [x2, y2] = P(ARM, d); el("line", { x1, y1, x2, y2, stroke: GOLD(.55), "stroke-width": .8 }, g); });
  needle(ox, oy, Sc, S.NEEDLE_BEARING);
  [[S.AXIS_N_LABEL, S.AXIS_N_BEARING], [S.AXIS_E_LABEL, S.AXIS_E_BEARING], [S.AXIS_W_LABEL, S.AXIS_W_BEARING]].forEach(([name, d]) => {
    const [x1, y1] = P((ARM + 2) * Sc, d), [x2, y2] = P((ARM + 22) * Sc, d);
    el("line", { x1: ox + x1, y1: oy + y1, x2: ox + x2, y2: oy + y2, stroke: GOLD(.5), "stroke-width": 1.2 });
    const [dx, dy] = P((ARM + 30) * Sc, d), cx = ox + dx, cy = oy + dy, top = d === 0;
    el("circle", { cx, cy, r: 9, fill: "none", stroke: GOLD(.6), "stroke-width": 1.4 });
    el("circle", { cx, cy, r: 4, fill: GOLD(.9) });
    txt(name, { x: cx, y: cy + (top ? -22 : 46), "text-anchor": "middle", fill: "#F5F0E8", "font-size": 24, "font-weight": 500, "letter-spacing": 3 }, cur, true);
    txt(d + "°", { x: cx, y: cy + (top ? -50 : 74), "text-anchor": "middle", fill: GOLD(.75), "font-size": 17, "letter-spacing": 2 }, cur, true);
  });
  const ppx = ox + px * Sc, ppy = oy + py * Sc;
  txt(S.PLOT_LABEL_LINE_1, { x: ppx, y: ppy + 56, "text-anchor": "middle", fill: "#E7CF9F", "font-size": 26, "font-weight": 500, "letter-spacing": 3 }, cur, true);
  txt(S.PLOT_LABEL_LINE_2, { x: ppx, y: ppy + 92, "text-anchor": "middle", fill: GOLD(1), "font-size": 24, "letter-spacing": 2.5 }, cur, true);
}


/* ---- portrait (Anwar), faded into the navy; rooster variants ---- */
function portrait() {
  const defs = el("defs"), SC = 1.12, W0 = 1024 * SC, X0 = 346, Y0 = 205;
  const gl = el("radialGradient", { id: "pg", gradientUnits: "userSpaceOnUse", cx: 890, cy: 590, r: 600 }, defs);
  el("stop", { offset: 0, "stop-color": "#6f9ac4", "stop-opacity": .62 }, gl);
  el("stop", { offset: 0.55, "stop-color": "#3f6a94", "stop-opacity": .28 }, gl);
  el("stop", { offset: 1, "stop-color": "#3f6a94", "stop-opacity": 0 }, gl);
  el("rect", { width: L.W, height: L.H, fill: "url(#pg)" });
  const gg = el("radialGradient", { id: "pg2", gradientUnits: "userSpaceOnUse", cx: 1000, cy: 1300, r: 520 }, defs);
  el("stop", { offset: 0, "stop-color": "#C8A96E", "stop-opacity": .34 }, gg); el("stop", { offset: 1, "stop-color": "#C8A96E", "stop-opacity": 0 }, gg);
  el("rect", { width: L.W, height: L.H, fill: "url(#pg2)" });
  const im = el("image", { href: "anwar_cutout.png", x: X0, y: Y0, width: W0, height: W0 });
  im.setAttribute("style", "filter: brightness(1.06) contrast(1.05) saturate(.95)");
}
function portraitCentered() {
  const defs = el("defs"), SC = 1.2, W0 = 1024 * SC, X0 = 540 - 490 * SC, Y0 = 70;
  const gl = el("radialGradient", { id: "cg", gradientUnits: "userSpaceOnUse", cx: 540, cy: 430, r: 600 }, defs);
  el("stop", { offset: 0, "stop-color": "#6f9ac4", "stop-opacity": .60 }, gl);
  el("stop", { offset: 0.55, "stop-color": "#3f6a94", "stop-opacity": .26 }, gl);
  el("stop", { offset: 1, "stop-color": "#3f6a94", "stop-opacity": 0 }, gl);
  el("rect", { width: L.W, height: L.H, fill: "url(#cg)" });
  const lg = el("linearGradient", { id: "cf", gradientUnits: "userSpaceOnUse", x1: 0, y1: 700, x2: 0, y2: 930 }, defs);
  el("stop", { offset: 0, "stop-color": "#fff", "stop-opacity": 1 }, lg); el("stop", { offset: 1, "stop-color": "#fff", "stop-opacity": 0 }, lg);
  const m = el("mask", { id: "cmask", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: L.W, height: L.H }, defs);
  el("rect", { width: L.W, height: 700, fill: "#fff" }, m);
  el("rect", { y: 700, width: L.W, height: 230, fill: "url(#cf)" }, m);
  const g = el("g", { mask: "url(#cmask)" });
  const im = el("image", { href: "anwar_cutout.png", x: X0, y: Y0, width: W0, height: W0 }, g);
  im.setAttribute("style", "filter: brightness(1.06) contrast(1.05) saturate(.95)");
}
function heroRooster(y = 790, w = 800) {
  const defs = el("defs"), g = el("radialGradient", { id: "rg", gradientUnits: "userSpaceOnUse", cx: 640, cy: 1010, r: 440 }, defs);
  el("stop", { offset: 0, "stop-color": "#C8A96E", "stop-opacity": .30 }, g); el("stop", { offset: 1, "stop-color": "#C8A96E", "stop-opacity": 0 }, g);
  el("rect", { width: L.W, height: L.H, fill: "url(#rg)" });
  el("image", { href: "rooster_alpha.png", x: 1080 - w - 30, y, width: w, height: w * 400 / 736 });
}
function smallRooster() { el("image", { href: "rooster_alpha.png", x: 70, y: 840, width: 380, height: 380 * 400 / 736 }); }

/* ---- builders ---- */
const BUILDERS = {
  cover(C, S) {
    background(L.needle.x, L.needle.y);
    if (S.portrait) portrait(); else { heroRooster(); }
    if (!S.portrait) needle(L.needle.x, L.needle.y, L.needle.scale);
    chrome(C, { arrow: true });
    let nSize = 250; const cink = inkBox(S.numeral, nSize, 900, -3);
    txt(S.numeral, { x: L.M + cink.left, y: 440, fill: "rgba(205,172,108,.88)", "font-weight": 900, "font-size": nSize, "letter-spacing": -3 });
    headBlock(S, L.M, 560, 632, 96, 2);
    subBlock(S.sub, L.M, 632 + 78, 420, 50, 2);
  },
  point(C, S) {
    background(L.needle.x, L.needle.y); needle(L.needle.x, L.needle.y, L.needle.scale);
    chrome(C);
    const hx = 300, last = 640, nSize = 366;                       // text block edge, last headline baseline, numeral size
    const ink = inkBox(S.numeral, nSize, 900, -4);
    txt(S.numeral, { x: hx - 6 - ink.right, y: last + 8, fill: "rgba(205,172,108,.88)", "font-weight": 900, "font-size": nSize, "letter-spacing": -4 });   // numeral sits beside the text, overlapping only its leading edge
    headBlock(S, hx, L.R - hx, last, 94, Math.max(2, S.headline.split('|').length));
    subBlock(S.sub, hx, last + 86, L.R - hx, 56, Math.max(2, S.sub.split('|').length));   // each forced line stays on one line; type shrinks to fit
  },
  closing(C, S) {
    background(540, 430);
    portraitCentered();
    chrome(C, { arrow: false });
    const h = headBlock(S, 540, 900, 950, 88, Math.max(2, S.headline.split('|').length), "middle");
    subBlock(S.sub, 540, 950 + 80, 760, 46, 2, "middle");
  },
  reading(C, S) {
    const cx = 540, cy = 800, sc = 1.9;
    background(cx, cy);
    chrome(C);
    const hs = headBlock(S, L.M, 840, 330, 96, 2);
    subBlock(S.sub, L.M, 330 + 64, 760, 36, 2);
    fullCompass(S, cx, cy, sc);
  },
};

function buildAll(C, only) {
  const root = document.getElementById("root"); root.innerHTML = "";
  C.SLIDES.forEach((S, i) => {
    if (only !== undefined && only !== i) return;
    const wrap = document.createElement("div"); wrap.className = "slide"; root.appendChild(wrap);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", L.W); svg.setAttribute("height", L.H); svg.setAttribute("viewBox", `0 0 ${L.W} ${L.H}`);
    wrap.appendChild(svg); cur = svg;
    curSource = S.source || C.SOURCE; curNarrow = !!(S.portrait || S.heroRooster || S.type === 'closing'); curHero = !!S.heroRooster;
    BUILDERS[S.type](C, S);
  });
}
window.renderSlides = (only) => buildAll(Object.assign({}, CONTENT, window.__OVERRIDE__ || {}), only);
window.SLIDE_COUNT = CONTENT.SLIDES.length;
Promise.all([300, 400, 500, 800, 900].map((w) => document.fonts.load(`${w} 20px "IN"`))).then(() => document.fonts.load('400 20px "JB"')).then(() => document.fonts.ready).then(() => { window.__READY__ = true; });
</script>
</body>
</html>
