<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Reading the Regulator</title>
<style>
@font-face { font-family: "JB"; font-weight: 400; src: url(fonts/jb400.ttf); }
@font-face { font-family: "JB"; font-weight: 500; src: url(fonts/jb500.ttf); }
@font-face { font-family: "CG"; font-weight: 700; src: url(fonts/cg700.ttf); }
@font-face { font-family: "IN"; font-weight: 300; src: url(fonts/inter300.ttf); }
@font-face { font-family: "IN"; font-weight: 800; src: url(fonts/inter800.ttf); }
html, body { margin: 0; background: #0D1B2A; }
svg { display: block; }
text { font-family: "JB", monospace; }
</style>
</head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
<script>
/* ==========================================================================
   READING THE REGULATOR — weekly content. Change ONLY this block each week.
   ========================================================================== */
const CONTENT = {
  // ---- fixed every week -------------------------------------------------
  SERIES_TAG_LINE_1: "SAWYER & CO.",
  SERIES_TAG_LINE_2: "READING THE REGULATOR — 01",   // bump the issue number weekly
  AXIS_N_LABEL: "REGULATION",     AXIS_N_BEARING: 0,
  AXIS_E_LABEL: "LIQUIDITY",      AXIS_E_BEARING: 120,
  AXIS_W_LABEL: "DIGITIZATION",   AXIS_W_BEARING: 240,

  // ---- variable every week ----------------------------------------------
  NEEDLE_BEARING: 0,                       // degrees; 0 = points N toward REGULATION
  PLOT_BEARING: 195,                       // degrees; keep 160-215 (clear lower field)
  PLOT_DISTANCE: 125,                      // distance from the needle (compass units; ~2 px each)
  PLOT_LABEL_LINE_1: "SCB SUPERVISORY EXAMS",
  PLOT_LABEL_LINE_2: "31 → 76  ·  2021–2025",
  PLOT_LABEL_LINE_3: "+45 EXAMS  ·  +145%  ·  ~25% A YEAR",   // derived from 31 → 76 over four years
  HEADLINE: "SCRUTINY UP 2.5×",           // large, heavy (auto-fits to one line)
  SUBHEAD: "Findings per exam fell. Total findings didn't.",   // one line, smaller, lighter
  FOOTER_SOURCE: "SOURCE · SCB EXAMINATIONS REPORT 2021–2025",
  FOOTER_URL: "sawyer-co.com",
};

/* layout knobs (not content) */
const LAYOUT = {
  W: 1080, H: 1350,
  compassCx: 540, compassCy: 412, compassScale: 2.5,
  headlineY: 1000, headlineMaxW: 940, headlineSize: 150,
  subheadY: 1064, subheadMaxW: 900, subheadSize: 30,
  rooster: { x: 76, y: 1085, width: 400 },             // still frame, screen-blended
  groundY: 1290,                                       // hairline the rooster stands on
  footerY: 1322, edgePad: 64,
};
/* ========================================================================== */

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const GOLD = (a) => `rgba(200,169,110,${a})`;
const NB = " ";
const nbsp = (s) => s.replace(/ /g, NB);
const el = (name, attrs = {}, parent = svg) => {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const txt = (str, attrs, parent) => { const t = el("text", attrs, parent); t.textContent = nbsp(str); return t; };
const toRad = (deg) => (deg - 90) * Math.PI / 180;
const P = (r, deg) => [r * Math.cos(toRad(deg)), r * Math.sin(toRad(deg))];

function render(C, L) {
  svg.innerHTML = "";
  const { W, H } = L;
  const R1 = 76, R2 = 65, R3 = 56, ARM = 90, DH = 40, DW = 24;

  // ---- ground: navy with a soft lift behind the compass
  const defs = el("defs");
  const rg = el("radialGradient", { id: "bg", cx: L.compassCx / W, cy: L.compassCy / H, r: 0.75 }, defs);
  el("stop", { offset: 0, "stop-color": "#16293d" }, rg);
  el("stop", { offset: 1, "stop-color": "#0D1B2A" }, rg);
  el("rect", { width: W, height: H, fill: "url(#bg)" });

  // ---- faint concentric radar rings
  [[300, .075], [420, .062], [540, .052], [660, .044], [780, .036], [900, .028], [1020, .02]].forEach(([r, o]) =>
    el("circle", { cx: L.compassCx, cy: L.compassCy, r, fill: "none", stroke: `rgba(210,190,150,${o})`, "stroke-width": 1.2 }));

  // ---- compass group (scaled about its centre)
  const g = el("g", { transform: `translate(${L.compassCx} ${L.compassCy}) scale(${L.compassScale})` });

  // plot line (needle -> reading). Bearing is kept to the clear lower field (160-215 deg)
  // so the reading label never lands on an axis label.
  const plotBearing = Math.min(215, Math.max(160, C.PLOT_BEARING));
  if (plotBearing !== C.PLOT_BEARING) console.warn("PLOT_BEARING clamped to " + plotBearing);
  const [px, py] = P(C.PLOT_DISTANCE, plotBearing);
  el("line", { x1: px, y1: py, x2: 0, y2: 0, stroke: GOLD(.55), "stroke-width": .9, "stroke-linecap": "round" }, g);
  [10, 17].forEach((r, i) => el("circle", { cx: px, cy: py, r, fill: "none", stroke: GOLD(i ? .16 : .38), "stroke-width": .7 }, g));
  el("circle", { cx: px, cy: py, r: 3.2, fill: "#c8a96e" }, g);

  // rose
  [[R1, .35, .8], [R2, .2, .6], [R3, .15, .5]].forEach(([r, o, w]) => el("circle", { cx: 0, cy: 0, r, fill: "none", stroke: GOLD(o), "stroke-width": w }, g));
  for (let deg = 0; deg < 360; deg += 10) {
    const major = deg % 30 === 0, card = deg % 90 === 0;
    const inner = card ? R2 - 4 : major ? R1 - 10 : R1 - 5;
    const [x1, y1] = P(inner, deg), [x2, y2] = P(R1, deg);
    el("line", { x1, y1, x2, y2, stroke: GOLD(card ? .8 : major ? .55 : .3), "stroke-width": card ? 1.2 : major ? .8 : .5 }, g);
  }
  [30, 60, 120, 150, 210, 240, 300, 330].forEach((deg) => {
    const [x, y] = P(R1 + 14, deg);
    txt(String(deg), { x, y: y + 3.5, "text-anchor": "middle", fill: GOLD(.4), "font-size": 7 }, g);
  });
  [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([l, deg]) => {
    const [x, y] = P(R2 - 14, deg);
    txt(l, { x, y: y + 4, "text-anchor": "middle", fill: GOLD(.75), "font-size": 13, "font-weight": 500 }, g);
  });
  [0, 90, 180, 270].forEach((deg) => {
    const [x1, y1] = P(R3, deg), [x2, y2] = P(ARM, deg);
    el("line", { x1, y1, x2, y2, stroke: GOLD(.5), "stroke-width": .8 }, g);
  });
  el("circle", { cx: 0, cy: 0, r: R1 + 8, fill: "none", stroke: GOLD(.18), "stroke-width": .6, "stroke-dasharray": "2 9" }, g);

  // faceted gold needle, rotated to NEEDLE_BEARING
  const n = el("g", { transform: `rotate(${C.NEEDLE_BEARING})` }, g);
  el("circle", { cx: 0, cy: 0, r: 30, fill: "rgba(200,169,110,.07)" }, n);
  const poly = (pts, fill) => el("polygon", { points: pts.map((p) => p.join(",")).join(" "), fill }, n);
  poly([[0, -DH], [-DW, 0], [0, DH]], "rgba(120,90,35,.6)");
  poly([[0, -DH], [DW, 0], [0, DH]], "rgba(215,178,100,.75)");
  poly([[0, -DH], [-DW, 0], [-DW * .35, -DH * .3]], "rgba(175,140,72,.55)");
  poly([[0, -DH], [DW, 0], [DW * .35, -DH * .3]], "rgba(245,215,148,.65)");
  poly([[0, DH], [-DW, 0], [-DW * .3, DH * .35]], "rgba(100,78,30,.5)");
  poly([[0, DH], [DW, 0], [DW * .3, DH * .35]], "rgba(165,132,65,.55)");
  poly([[0, -DH], [DW * .55, -DH * .3], [DW * .18, -DH * .52]], "rgba(255,252,235,.72)");
  poly([[DW * .08, -DH], [DW * .2, -DH * .62], [DW * .06, -DH * .72]], "rgba(255,255,248,.5)");
  el("polygon", { points: `0,${-DH} ${DW},0 0,${DH} ${-DW},0`, fill: "none", stroke: "rgba(218,185,115,.85)", "stroke-width": .9 }, n);
  el("circle", { cx: 0, cy: 0, r: 2.2, fill: "rgba(255,250,225,.95)" }, n);

  // three axis labels, placed by bearing in pixel space so type size stays fixed
  const S = L.compassScale, ox = L.compassCx, oy = L.compassCy;
  [[C.AXIS_N_LABEL, C.AXIS_N_BEARING, "middle"], [C.AXIS_E_LABEL, C.AXIS_E_BEARING, "start"], [C.AXIS_W_LABEL, C.AXIS_W_BEARING, "end"]].forEach(([name, deg, anchor]) => {
    const [x1, y1] = P((ARM + 2) * S, deg), [x2, y2] = P((ARM + 22) * S, deg);
    el("line", { x1: ox + x1, y1: oy + y1, x2: ox + x2, y2: oy + y2, stroke: GOLD(.45), "stroke-width": 1.2 });
    const [dx0, dy0] = P((ARM + 30) * S, deg), cx = ox + dx0, cy = oy + dy0;
    el("circle", { cx, cy, r: 9, fill: "none", stroke: GOLD(.55), "stroke-width": 1.4 });
    el("circle", { cx, cy, r: 4, fill: GOLD(.8) });
    const dx = anchor === "start" ? 22 : anchor === "end" ? -22 : 0, top = deg === 0;
    txt(deg + "\u00B0", { x: cx + dx, y: cy + (top ? -46 : -8), "text-anchor": anchor, fill: GOLD(.6), "font-size": 15, "letter-spacing": 2 });
    txt(name, { x: cx + dx, y: cy + (top ? -22 : 16), "text-anchor": anchor, fill: "rgba(232,222,198,.95)", "font-size": 21, "font-weight": 500, "letter-spacing": 3.5 });
  });

  // plotted-reading label (pixel space, below the point)
  const ppx = L.compassCx + px * L.compassScale, ppy = L.compassCy + py * L.compassScale;
  txt(C.PLOT_LABEL_LINE_1, { x: ppx, y: ppy + 58, "text-anchor": "middle", fill: "rgba(210,185,135,.95)", "font-size": 21, "font-weight": 500, "letter-spacing": 3 });
  txt(C.PLOT_LABEL_LINE_2, { x: ppx, y: ppy + 90, "text-anchor": "middle", fill: GOLD(.85), "font-size": 21, "letter-spacing": 2.5 });
  txt(C.PLOT_LABEL_LINE_3, { x: ppx, y: ppy + 120, "text-anchor": "middle", fill: GOLD(.6), "font-size": 15, "letter-spacing": 3 });

  // series tag, top-left
  txt(C.SERIES_TAG_LINE_1, { x: L.edgePad, y: 78, fill: "rgba(225,215,190,.9)", "font-size": 17, "font-weight": 500, "letter-spacing": 4.5 });
  txt(C.SERIES_TAG_LINE_2, { x: L.edgePad, y: 106, fill: GOLD(.7), "font-size": 14, "letter-spacing": 4 });

  // headline block, centred, auto-fit to one line each
  const fit = (t, maxW, size) => { let s = size; t.setAttribute("font-size", s); while (t.getComputedTextLength() > maxW && s > 20) { s -= 1; t.setAttribute("font-size", s); } };
  const h = el("text", { x: W / 2, y: L.headlineY, "text-anchor": "middle", fill: "#F5F0E8", "font-family": "IN", "font-weight": 800, "letter-spacing": 1 });
  h.textContent = C.HEADLINE; h.style.fontFamily = '"IN", sans-serif'; fit(h, L.headlineMaxW, L.headlineSize);
  const s = el("text", { x: W / 2, y: L.subheadY, "text-anchor": "middle", fill: "#C9B99A", "font-weight": 300, "letter-spacing": .3 });
  s.textContent = C.SUBHEAD; s.style.fontFamily = '"IN", sans-serif'; fit(s, L.subheadMaxW, L.subheadSize);

  // ground line with instrument ticks
  el("line", { x1: L.edgePad, y1: L.groundY, x2: W - L.edgePad, y2: L.groundY, stroke: GOLD(.45), "stroke-width": 1 });
  for (let x = L.edgePad; x <= W - L.edgePad; x += 24) el("line", { x1: x, y1: L.groundY, x2: x, y2: L.groundY + ((x - L.edgePad) % 120 === 0 ? 9 : 5), stroke: GOLD(.35), "stroke-width": 1 });

  // rooster, walking along the bottom (still frame; black drops out under screen)
  const r = L.rooster;
  const img = el("image", { href: "rooster.png", x: r.x, y: r.y, width: r.width, height: r.width * 400 / 736 });
  img.style.mixBlendMode = "screen";

  // footer, pinned to the bottom edge
  txt(C.FOOTER_SOURCE, { x: L.edgePad, y: L.footerY, fill: GOLD(.6), "font-size": 13, "letter-spacing": 2.6 });
  txt(C.FOOTER_URL, { x: W - L.edgePad, y: L.footerY, "text-anchor": "end", fill: GOLD(.6), "font-size": 13, "letter-spacing": 2.6 });
}

document.fonts.load('800 20px "IN"').then(() => document.fonts.load('300 20px "IN"')).then(() => document.fonts.ready).then(() => {
  render(Object.assign({}, CONTENT, window.__OVERRIDE__ || {}), LAYOUT);
  window.__READY__ = true;
});
</script>
</body>
</html>
