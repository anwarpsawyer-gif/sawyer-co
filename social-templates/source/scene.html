<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "JB"; font-weight: 400; src: url(fonts/jb1.ttf); }
@font-face { font-family: "JB"; font-weight: 500; src: url(fonts/jb2.ttf); }
html, body { margin: 0; background: #0D1B2A; overflow: hidden; }
#stage { position: relative; width: 1080px; background: #0D1B2A; overflow: hidden; }
#glow { position: absolute; inset: 0; }
svg { position: absolute; inset: 0; width: 100%; height: 100%; }
text { font-family: "JB", monospace; }
.fadein { opacity: 0; animation: fadeIn 1.6s ease forwards; }
.label { opacity: 0; animation: labelReveal 0.9s ease forwards; }
.draw { animation: draw 2.2s ease-in-out forwards; }
.breathe { animation: breathe 8s ease-in-out infinite alternate; }
.sonar { transform-box: fill-box; transform-origin: center; animation: sonar 3.6s ease-out infinite; }
.pulse { animation: pulse 5s ease-in-out infinite; }
.orbit { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop 1.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes labelReveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes breathe { from { opacity: .55; } to { opacity: 1; } }
@keyframes sonar { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: .9; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.3); } 65% { transform: scale(1.1); } to { transform: scale(1); } }
</style>
</head>
<body>
<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const q = new URLSearchParams(location.search);
const FORMAT = q.get("format") || "post";
const H = FORMAT === "story" ? 1920 : 1350;
const CXs = 540;
// compass centre + scale per format (story keeps top/bottom 250px clear for platform UI)
const CYs = FORMAT === "story" ? 760 : 520;
const S = FORMAT === "story" ? 2.2 : 2.3;

const stage = document.getElementById("stage");
stage.style.height = H + "px";
const svg = document.getElementById("svg");
svg.setAttribute("viewBox", `0 0 1080 ${H}`);

const GOLD = (a) => `rgba(200,169,110,${a})`;
const toRad = (deg) => (deg - 90) * Math.PI / 180;
const R1 = 76, R2 = 65, R3 = 56, ARM = 90, DH = 40, DW = 24;
const el = (name, attrs = {}, parent) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

// background: vignette + breathing arcs (from the site's Main Hall)
const defs = el("defs", {}, svg);
const rg = el("radialGradient", { id: "bg", cx: "50%", cy: `${(CYs / H * 100).toFixed(1)}%`, r: "75%" }, defs);
el("stop", { offset: "0", "stop-color": "#16293d" }, rg);
el("stop", { offset: "1", "stop-color": "#0D1B2A" }, rg);
el("rect", { width: 1080, height: H, fill: "url(#bg)" }, svg);

const arcs = [[300, .07, "0s"], [420, .06, "1s"], [540, .055, "2s"], [660, .048, "3s"], [780, .038, "4s"], [900, .028, "5s"]];
arcs.forEach(([r, op, delay]) => {
  const a1 = Math.PI * 0.0, a2 = Math.PI * 2;
  el("circle", { cx: CXs, cy: CYs, r, fill: "none", stroke: `rgba(210,190,150,${op})`, "stroke-width": 1.2, class: "breathe", style: `animation-delay:${delay}` }, svg);
});

// compass group, scaled about its centre
const g = el("g", { transform: `translate(${CXs} ${CYs}) scale(${S})` }, svg);
const P = (r, deg) => [r * Math.cos(toRad(deg)), r * Math.sin(toRad(deg))];

// bearing line draw-in (from lower-left 'Harbour Island' point to centre)
const [hx, hy] = P(150, 215);
el("circle", { cx: hx, cy: hy, r: 3, fill: "#c8a96e", class: "fadein", style: "animation-delay:.2s;animation-duration:.8s" }, g);
[0, 1.2, 2.4].forEach((d) => el("circle", { cx: hx, cy: hy, r: 10, fill: "none", stroke: GOLD(.4), "stroke-width": .7, class: "sonar", style: `animation-delay:${d + .6}s;opacity:0` }, g));
const len = Math.hypot(hx, hy);
el("line", { x1: hx, y1: hy, x2: 0, y2: 0, stroke: GOLD(.45), "stroke-width": .9, "stroke-linecap": "round", "stroke-dasharray": len, "stroke-dashoffset": len, class: "draw", style: "animation-delay:.2s" }, g);
const hl = el("g", { class: "label", style: "animation-delay:.9s" }, g);
const ht = el("text", { x: hx, y: hy + 22, "text-anchor": "middle", fill: "rgba(210,185,135,.95)", "font-size": 9.5, "letter-spacing": "1.5", "font-weight": 500 }, hl); ht.textContent = "HARBOUR ISLAND";
const ht2 = el("text", { x: hx, y: hy + 33, "text-anchor": "middle", fill: GOLD(.75), "font-size": 8.5, "letter-spacing": "1.3" }, hl); ht2.textContent = "N 25.5°";

// rose
const rose = el("g", { class: "fadein", style: "animation-delay:2.2s" }, g);
[[R1, .35, .8], [R2, .2, .6], [R3, .15, .5]].forEach(([r, o, w]) => el("circle", { cx: 0, cy: 0, r, fill: "none", stroke: GOLD(o), "stroke-width": w }, rose));
for (let deg = 0; deg < 360; deg += 10) {
  const major = deg % 30 === 0, card = deg % 90 === 0;
  const inner = card ? R2 - 4 : major ? R1 - 10 : R1 - 5;
  const [x1, y1] = P(inner, deg), [x2, y2] = P(R1, deg);
  el("line", { x1, y1, x2, y2, stroke: GOLD(card ? .8 : major ? .55 : .3), "stroke-width": card ? 1.2 : major ? .8 : .5 }, rose);
}
[30, 60, 120, 150, 210, 240, 300, 330].forEach((deg) => {
  const [x, y] = P(R1 + 14, deg);
  const t = el("text", { x, y: y + 3.5, "text-anchor": "middle", fill: GOLD(.4), "font-size": 7 }, rose); t.textContent = deg;
});
[["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([l, deg]) => {
  const [x, y] = P(R2 - 14, deg);
  const t = el("text", { x, y: y + 4, "text-anchor": "middle", fill: GOLD(.75), "font-size": 13, "font-weight": 500 }, rose); t.textContent = l;
});
[0, 90, 180, 270].forEach((deg) => {
  const [x1, y1] = P(R3, deg), [x2, y2] = P(ARM, deg);
  el("line", { x1, y1, x2, y2, stroke: GOLD(.5), "stroke-width": .8 }, rose);
});
el("circle", { cx: 0, cy: 0, r: R1 + 8, fill: "none", stroke: GOLD(.18), "stroke-width": .6, "stroke-dasharray": "2 9", class: "orbit" }, rose);

// diamond needle
const needle = el("g", { class: "pop", style: "animation-delay:2.4s;transform:scale(.3)" }, g);
el("circle", { cx: 0, cy: 0, r: 30, fill: "rgba(200,169,110,.07)" }, needle);
const poly = (pts, fill) => el("polygon", { points: pts.map((p) => p.join(",")).join(" "), fill }, needle);
poly([[0, -DH], [-DW, 0], [0, DH]], "rgba(120,90,35,.6)");
poly([[0, -DH], [DW, 0], [0, DH]], "rgba(215,178,100,.75)");
poly([[0, -DH], [-DW, 0], [-DW * .35, -DH * .3]], "rgba(175,140,72,.55)");
poly([[0, -DH], [DW, 0], [DW * .35, -DH * .3]], "rgba(245,215,148,.65)");
poly([[0, DH], [-DW, 0], [-DW * .3, DH * .35]], "rgba(100,78,30,.5)");
poly([[0, DH], [DW, 0], [DW * .3, DH * .35]], "rgba(165,132,65,.55)");
poly([[0, -DH], [DW * .55, -DH * .3], [DW * .18, -DH * .52]], "rgba(255,252,235,.72)");
el("polygon", { points: `0,${-DH} ${DW},0 0,${DH} ${-DW},0`, fill: "none", stroke: "rgba(218,185,115,.85)", "stroke-width": .9 }, needle);
el("circle", { cx: 0, cy: 0, r: 2.2, fill: "rgba(255,250,225,.95)" }, needle);
el("polygon", { points: `0,${-DH} ${DW},0 0,${DH} ${-DW},0`, fill: "none", stroke: GOLD(.4), "stroke-width": .7, class: "pulse", style: "animation-delay:3.6s" }, needle);

// three bearings: REGULATION 0°, LIQUIDITY 120°, DIGITIZATION 240°
[["REGULATION", 0, "middle"], ["LIQUIDITY", 120, "start"], ["DIGITIZATION", 240, "end"]].forEach(([name, deg, anchor], i) => {
  const grp = el("g", { class: "label", style: `animation-delay:${3.1 + i * .65}s` }, g);
  const [x1, y1] = P(ARM + 2, deg), [x2, y2] = P(ARM + 22, deg);
  el("line", { x1, y1, x2, y2, stroke: GOLD(.4), "stroke-width": .7 }, grp);
  const [cx, cy] = P(ARM + 30, deg);
  el("circle", { cx, cy, r: 4, fill: "none", stroke: GOLD(.5), "stroke-width": .8 }, grp);
  el("circle", { cx, cy, r: 2, fill: GOLD(.7) }, grp);
  const dx = anchor === "start" ? 12 : anchor === "end" ? -12 : 0;
  const dy = deg === 0 ? -14 : 4;
  const a = el("text", { x: cx + dx, y: cy + dy - (deg === 0 ? 12 : 8), "text-anchor": anchor, fill: GOLD(.55), "font-size": 8, "letter-spacing": "1" }, grp); a.textContent = deg + "°";
  const b = el("text", { x: cx + dx, y: cy + dy + (deg === 0 ? 0 : 4), "text-anchor": anchor, fill: "rgba(225,215,190,.88)", "font-size": 10.5, "letter-spacing": "2.2" }, grp); b.textContent = name;
});

// deterministic frame stepping for capture
window.seek = (ms) => { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = ms; }); };
</script>
</body>
</html>
